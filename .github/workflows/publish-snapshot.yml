name: Publish SaltUI snapshot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saltui-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GRADLE_JVM_ARGS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install X11 window manager
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y openbox x11-utils

      - name: Run SaltUI coverage verification
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >-
          xvfb-run --auto-servernum
          --error-file=/dev/stderr
          --server-args="-screen 0 1920x1080x24 -nolisten tcp"
          bash .github/scripts/verify-linux-desktop.sh

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-reports
          path: |
            ui2/build/reports/
            ui2/build/test-results/desktopTest/
          if-no-files-found: ignore

  publish:
    name: Publish all KMP snapshots
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      GRADLE_JVM_ARGS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish platform snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="${GRADLE_JVM_ARGS}"
          -Pkotlin.compiler.execution.strategy=in-process
          -PsnapshotPublication=true
          :core:publishAndroidPublicationToGitHubPackagesRepository
          :core:publishDesktopPublicationToGitHubPackagesRepository
          :core:publishIosArm64PublicationToGitHubPackagesRepository
          :core:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :ui2:publishAndroidPublicationToGitHubPackagesRepository
          :ui2:publishDesktopPublicationToGitHubPackagesRepository
          :ui2:publishIosArm64PublicationToGitHubPackagesRepository
          :ui2:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :ui-navigation:publishAndroidPublicationToGitHubPackagesRepository
          :ui-navigation:publishDesktopPublicationToGitHubPackagesRepository
          :ui-navigation:publishIosArm64PublicationToGitHubPackagesRepository
          :ui-navigation:publishIosSimulatorArm64PublicationToGitHubPackagesRepository

      - name: Publish KMP metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="${GRADLE_JVM_ARGS}"
          -Pkotlin.compiler.execution.strategy=in-process
          -PsnapshotPublication=true
          :core:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :ui2:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :ui-navigation:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
